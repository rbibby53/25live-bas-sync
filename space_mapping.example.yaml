# ─────────────────────────────────────────────────────────────────────────────
# space_mapping.example.yaml — 25Live  →  Niagara schedule cross-reference
# ─────────────────────────────────────────────────────────────────────────────
#
# Copy this to space_mapping.yaml (or just run editor.py, which creates it):
#
#   cp space_mapping.example.yaml space_mapping.yaml
#
# space_mapping.yaml is gitignored so your real room list stays local.
#
# Up to three sections:
#   buildings:  each building's roll-up schedule, defined ONCE.
#   floors:     (optional) per-floor hallway schedules for buildings that control
#               hallway HVAC per floor.
#   spaces:     the rooms; each names its building and (optionally) its floor.
#
# HOW THE BUILDING CALENDAR IS BUILT
#   Every room that names a `building` is automatically unioned into that
#   building's occupancy schedule. So if ANY room in the building is occupied,
#   the building schedule (lobbies, common AHUs) runs HVAC too. You do NOT
#   repeat the building's Niagara path on each room — you just give the building
#   id. That makes "all rooms in the building" the default.
#
# PER-FLOOR HALLWAY HVAC
#   For buildings controlled per floor, define each floor under `floors:` and
#   give each room a `floor:`. A room then ALSO drives its floor's hallway
#   schedule — so floors roll up into the building (room -> floor -> building):
#   the floor hallway runs if any room on that floor is booked, and the building
#   runs if any floor is.
#
# ── buildings: fields ──
#   id            (required)  short key that rooms reference (e.g. social_sciences)
#   name          (optional)  label for logs
#   niagara_path  (required)  the building roll-up schedule slot, RELATIVE to
#                             niagara.schedule_base_path in config.yaml
#                             (default slot:/Schedules)
#   pre_condition_minutes (optional)  building-wide run-up default for ITS rooms;
#                             beats the global default but a room can still
#                             override it (precedence: room > building > global)
#   post_buffer_minutes   (optional)  building-wide run-down default for ITS rooms
#                             (same precedence)
#   space_id      (optional)  ONLY if the building common area is itself bookable
#                             in 25Live (e.g. an atrium); its own events then also
#                             count toward the building schedule
#
# ── floors: fields ── (optional section)
#   building      (required)  id of the building this floor belongs to
#   level         (required)  the floor number (integer)
#   niagara_path  (required)  this floor's hallway schedule slot
#
# ── spaces: (room) fields ──
#   space_id              (required)  25Live numeric space id (from the space's
#                                     URL / detail in 25Live -> Locations)
#   space_name            (optional)  label for logs; defaults to the id
#   building              (optional)  id of the building this room rolls into.
#                                     Omit for a room that should run on its own
#                                     and NOT drive any building schedule.
#   floor                 (optional)  floor number; must match a floors: entry
#                                     for this building. Drives that floor's
#                                     hallway schedule (in addition to building).
#   niagara_path          (required)  this room's own schedule slot
#   pre_condition_minutes (optional)  HVAC lead time BEFORE events. Precedence:
#                                     room > building > global default (30)
#   post_buffer_minutes   (optional)  hold time AFTER events. Precedence:
#                                     room > building > global default (15)
#   merge_gap_minutes     (optional)  collapse this room's back-to-back windows
#                                     that are within this many minutes
#                                     (default 5). Merges ACROSS rooms (the
#                                     building roll-up) use the global default;
#                                     a room's own gap still shapes the windows
#                                     it contributes to its building.
#
# To add a room: copy a block, set space_id / niagara_path / building. Done —
# it joins its building's roll-up automatically.
# ─────────────────────────────────────────────────────────────────────────────

buildings:

  - id: social_sciences
    name: "Social Sciences"
    niagara_path: "SocialSciences/Building_Occ"

  - id: eng_tech
    name: "Engineering Technology"
    niagara_path: "EngTech/Building_Occ"
    pre_condition_minutes: 40   # whole building warms up early; rooms may override
    post_buffer_minutes: 20

  - id: student_center
    name: "Student Center"
    niagara_path: "StudentCenter/Building_Occ"
    space_id: 9001            # the atrium is itself bookable in 25Live


# Per-floor hallway schedules. Social Sciences controls hallway HVAC per floor,
# so each floor has its own schedule; a room on floor 2 drives Floor2_Hall (and
# the building). Omit this whole section for buildings without per-floor control.
floors:

  - building: social_sciences
    level: 1
    niagara_path: "SocialSciences/Floor1_Hall_Occ"

  - building: social_sciences
    level: 2
    niagara_path: "SocialSciences/Floor2_Hall_Occ"


spaces:

  # Two Social Sciences rooms on DIFFERENT floors. Each drives its own floor's
  # hallway schedule; both also roll up to SocialSciences/Building_Occ.
  - space_id: 1234
    space_name: "Social Sciences 1021"
    building: social_sciences
    floor: 1
    niagara_path: "SocialSciences/Rm1021_Occ"
    pre_condition_minutes: 45        # large lecture hall — longer warm-up
    post_buffer_minutes: 15

  - space_id: 1235
    space_name: "Social Sciences 2014"
    building: social_sciences
    floor: 2
    niagara_path: "SocialSciences/Rm2014_Occ"

  # A lab in Engineering Tech — rolls into EngTech/Building_Occ.
  - space_id: 2050
    space_name: "Engineering Tech 110 Lab"
    building: eng_tech
    niagara_path: "EngTech/Rm110_Occ"
    pre_condition_minutes: 60        # fume-hood lab — long pre-conditioning
    merge_gap_minutes: 30            # keep HVAC on between closely-spaced labs

  # A room that should run on its own only (no building roll-up): omit `building`.
  # - space_id: 3000
  #   space_name: "Standalone Annex"
  #   niagara_path: "Annex/Rm1_Occ"

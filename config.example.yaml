# ─────────────────────────────────────────────────────────────────────────────
# config.example.yaml — copy this to config.yaml and edit for YOUR institution.
# ─────────────────────────────────────────────────────────────────────────────
#
#   cp config.example.yaml config.yaml
#
# config.yaml is gitignored, so your site's settings stay out of version control.
# Anything you omit here falls back to the built-in defaults in main.py.
#
# SECRETS ARE NOT STORED HERE. Set the two passwords as environment variables:
#   BAS_25LIVE_PASSWORD     (the 25Live service-account password)
#   BAS_NIAGARA_PASSWORD    (the Niagara service-account password)
# ─────────────────────────────────────────────────────────────────────────────

collegenet:
  # Your Series25/25Live instance name. For CollegeNET-hosted sites the
  # WebServices base URL is built automatically as:
  #   https://webservices.collegenet.com/r25ws/wrd/<instance>/run
  instance: "your-instance"

  # Self-hosted Series25? Set base_url explicitly and leave instance blank.
  base_url: ""

  username: "svc-25live"        # a LOCAL 25Live account (NOT SSO) with read access
  include_states: [2]           # event states to sync: 2=confirmed (add 4 for tentative)
  # Scheduling defaults (run-up / run-down / merge-gap / lookahead) live in
  # defaults.yaml — see defaults.example.yaml.

niagara:
  host: "localhost"             # station host; localhost if this runs on the station
  port: 443                     # confirm for your station — often 443 or 8443
  https: true
  username: "svc-scheduler"     # a Niagara operator account
  verify_tls: false             # false for a self-signed cert; else a CA-bundle path
  schedule_base_path: "slot:/Schedules"          # where your BooleanSchedules live
  heartbeat_path: "slot:/Schedules/_LastSync"    # a point stamped each run (or "" to disable)

# Your campus timezone as an IANA name (e.g. America/New_York, America/Chicago,
# America/Denver, America/Los_Angeles).
timezone: "America/New_York"

# Retry transient 25Live/Niagara errors (timeouts, 429, 5xx). Applied to reads
# and the idempotent clear; writes are not auto-retried.
retry:
  attempts: 3
  backoff_seconds: 2.0

# Notify on a failed (or optionally successful) sync run. Off by default.
# Email SMTP password comes from the env var BAS_SMTP_PASSWORD.
alerts:
  enabled: false
  notify_on_success: false
  webhook_url: ""               # Slack/Teams/generic incoming webhook URL
  email:
    enabled: false
    smtp_host: "smtp.example.edu"
    smtp_port: 587
    use_tls: true
    username: "alerts@example.edu"
    from_addr: "alerts@example.edu"
    to_addrs:
      - "facilities@example.edu"

# Optional overrides (sensible defaults are used if omitted):
# space_map_file: "space_mapping.yaml"
# log_file: "logs/25live_sync.log"

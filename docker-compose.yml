# 25Live -> Niagara sync.
#
#   docker compose up -d           # self-scheduling nightly sync (SYNC_AT below)
#   docker compose logs -f         # watch it
#   docker compose run --rm -e SYNC_AT= sync --validate   # one-shot pre-flight
#   docker compose run --rm -e SYNC_AT= sync --dry-run    # one-shot, no writes
#
# Put your config.yaml, defaults.yaml, and space_mapping.yaml in ./config
# (copy the .example files). Put secrets in a gitignored .env file beside this
# one — compose loads it automatically:
#
#   BAS_25LIVE_PASSWORD=...
#   BAS_NIAGARA_PASSWORD=...
#   TZ=America/New_York

services:
  sync:
    build: .
    image: 25live-niagara-sync
    container_name: 25live-niagara-sync
    environment:
      # Secrets are read from the environment / .env — never baked into config.
      BAS_25LIVE_PASSWORD: ${BAS_25LIVE_PASSWORD:?set BAS_25LIVE_PASSWORD in .env}
      BAS_NIAGARA_PASSWORD: ${BAS_NIAGARA_PASSWORD:?set BAS_NIAGARA_PASSWORD in .env}
      BAS_SMTP_PASSWORD: ${BAS_SMTP_PASSWORD:-}
      TZ: ${TZ:-America/New_York}
      # Built-in daily scheduler. Clear it (-e SYNC_AT=) for a one-shot run.
      SYNC_AT: ${SYNC_AT:-02:00}
      SYNC_ON_START: ${SYNC_ON_START:-0}
    volumes:
      - ./config:/config:ro      # config.yaml, defaults.yaml, space_mapping.yaml
      - ./logs:/app/logs         # optional; logs also go to `docker compose logs`
    restart: unless-stopped

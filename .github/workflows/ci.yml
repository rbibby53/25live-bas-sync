name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the supported floor; 3.14 is current. 3.9 and 3.10
        # are past end of life and are not supported.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # The BACnet driver is an optional extra. Run the suite both with and
        # without BACpypes3 installed, so neither the lazy import nor the
        # "skipped" path silently rots.
        bacnet: [ "with-bacnet", "without-bacnet" ]
    name: py${{ matrix.python-version }} (${{ matrix.bacnet }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install BACpypes3
        if: matrix.bacnet == 'with-bacnet'
        run: pip install -r requirements-bacnet.txt
      - name: Byte-compile
        run: python -m compileall -q main.py editor.py Test.py bassync
      - name: Run offline tests
        run: python Test.py
      - name: CLI smoke test
        run: |
          python main.py --list-drivers
          python main.py --version
